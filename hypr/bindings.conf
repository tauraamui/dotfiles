# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# WhatsApp window rules - assign to special workspace
# windowrule = workspace special:whatsapp, title:^(WhatsApp).*
# windowrule = workspace special:whatsapp, class:^(WhatsApp).*
# Alternative rule if the above doesn't catch it
# windowrule = workspace special:whatsapp, initialTitle:^(WhatsApp).*

bindd = SUPER, return, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
# bindd = SUPER, M, Music, exec, omarchy-launch-or-focus youtube-music-for-desktop
bindd = SUPER, M, Music, exec, omarchy-launch-tui cliamp
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"
# bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, L, Lock screen, exec, hyprlock
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
# bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER, A, Crunchyroll, exec, omarchy-launch-webapp "https://crunchyroll.com"
bindd = SUPER, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, C, Chess, exec, omarchy-launch-webapp "https://chess.com"
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
# bindd = SUPER, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER, G, WhatsApp, exec, hyprctl dispatch togglespecialworkspace whatsapp; omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bind = SUPER SHIFT, G, togglespecialworkspace, whatsapp
bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# custom workspace navigation binds
bind = SUPER, bracketleft, workspace, -1
bind = SUPER, bracketright, workspace, +1

# custom volume control bindings
bindeld = SUPER, Prior, Volume up, exec, $osdclient --output-volume raise
bindeld = SUPER, Next, Volume down, exec, $osdclient --output-volume lower
# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
