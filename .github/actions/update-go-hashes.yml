name: Update Go Module Hashes
on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:
  pull_request:  # Run on PRs so you can test it
    paths:
      - '.github/workflows/update-go-hashes.yml'  # Only when this file changes

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: DeterminateSystems/determinate-nix-action@v3
      
      - name: Update git revisions and fix hashes
        run: |
          # For each Go package, update the rev and fix hashes
          nix-shell -p nix-prefetch-github --run '
            for pkg in crush gofumpt goimports scc sqlc gotestsum invoice; do
              echo "Processing $pkg..."
              # Try building, capture hash mismatch
              nix build --impure --expr \
                "(import <nixpkgs> {}).callPackage ./home.nix {}" \
                2>&1 | tee build.log || true
            done
          '
      
      - name: Apply hash fixes
        if: failure()
        run: |
          determinate-nixd fix hashes --auto-apply
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update Go module hashes"
          title: "Update Go module vendorHashes"
          body: |
            Automated update of Go module dependencies and their vendorHashes.
            
            This PR was auto-generated by the update-hashes workflow.
          branch: update-go-hashes
          delete-branch: true
