name: Update Package Hashes

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      package:
        description: 'Specific package to update (leave empty for all)'
        required: false
        type: string

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the update script with GitHub token for higher rate limits
          ./update-hashes.sh
        id: update

      - name: Check for changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No updates needed"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Updates detected"
            echo ""
            echo "Changes made:"
            git diff --stat
          fi
        id: changes

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update package versions and hashes'
          title: 'Automated package hash updates'
          body: |
            ## Automated Package Updates
            
            This PR updates Go package versions and SHA256 hashes in `home.nix`.
            
            ### Summary of changes:
            
            The following packages were checked and updated if needed:
            - **charmbracelet/crush** - Updated to latest release
            - **mvdan/gofumpt** - Updated to latest master commit
            - **golang/tools** - Updated to latest master commit (goimports)
            - **boyter/scc** - Updated to latest master commit
            - **sqlc-dev/sqlc** - Updated to latest main commit
            - **gotestyourself/gotestsum** - Updated to latest main commit
            - **maaslalani/invoice** - Updated to latest main commit
            
            ### What was updated:
            - Package revision/tag updated to latest
            - Source `sha256` hash updated
            - `vendorHash` set to `lib.fakeHash` (requires manual update)
            
            ### Next Steps:
            
            After merging this PR, please run:
            ```bash
            home-manager switch -b backup --impure --flake .
            ```
            
            The build output will show the correct `vendorHash` values. Update them in `home.nix` and re-run the command.
            
            ---
            
            *This PR was automatically generated by the update workflow.*
            
            ### Rate Limiting Note
            
            This workflow uses GitHub Actions token to avoid API rate limiting (5000 requests/hour vs 60 for unauthenticated requests).
            
            For local development, consider setting up a GitHub Personal Access Token:
            ```bash
            export GITHUB_TOKEN=your_token_here
            ./update-hashes.sh
            ```
          branch: automated/package-hash-updates
          delete-branch: true
